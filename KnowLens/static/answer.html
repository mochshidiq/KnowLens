<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KnowLens AI - Intelligence Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f1a;
            --card: #161e2d;
            --primary: #6366f1;
            --secondary: #38bdf8;
            --text-p: #94a3b8;
            --text-h: #f8fafc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0b0f1a 70%);
            color: var(--text-h);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .wrapper { width: 100%; max-width: 850px; }

        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 2.5rem; font-weight: 800; margin: 0; background: linear-gradient(to right, #818cf8, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { color: var(--text-p); margin-top: 10px; }

        /* Input Area */
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 12px;
            display: flex;
            gap: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        input { flex: 1; background: transparent; border: none; padding: 15px 20px; color: white; font-size: 16px; outline: none; }
        select { background: #1e293b; color: white; border: 1px solid #334155; border-radius: 14px; padding: 0 15px; cursor: pointer; outline: none; }
        
        .btn-generate {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-generate:hover { background: #4f46e5; transform: scale(1.02); box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); }

        /* Result Area */
        .result-container { display: none; animation: slideUp 0.6s ease-out forwards; }
        
        .answer-box {
            background: var(--card);
            border-radius: 24px;
            padding: 35px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .answer-box::before { content: ""; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--primary); }

        .typewriter { font-size: 18px; line-height: 1.8; color: #e2e8f0; font-weight: 400; margin-bottom: 25px; }

        .insight-box {
            background: rgba(56, 189, 248, 0.05);
            border-radius: 16px;
            padding: 20px;
            border-left: 3px solid var(--secondary);
            margin-top: 25px;
        }
        .insight-box h4 { margin: 0 0 8px 0; color: var(--secondary); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .insight-box p { margin: 0; font-size: 15px; color: var(--text-p); }

        .sources-area { margin-top: 30px; }
        .source-tag { display: inline-flex; align-items: center; background: #1e293b; border: 1px solid #334155; padding: 6px 14px; border-radius: 10px; font-size: 13px; color: var(--secondary); margin-right: 10px; margin-top: 10px; }

        /* Loader */
        .loading { display: none; text-align: center; padding: 40px; }
        .pulse { width: 12px; height: 12px; background: var(--primary); border-radius: 50%; display: inline-block; margin: 0 5px; animation: pulse 0.6s infinite alternate; }
        .pulse:nth-child(2) { animation-delay: 0.2s; }
        .pulse:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse { from { opacity: 1; transform: scale(1); } to { opacity: 0.3; transform: scale(0.8); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

<div class="wrapper">
    <div class="header">
        <h1>KnowLens AI</h1>
        <p>Expert Clinical Decision Support & Knowledge Retrieval</p>
    </div>

    <div class="glass-card">
        <input id="question" placeholder="Tanyakan sesuatu tentang Knowledge Management..." autocomplete="off">
        <select id="user">
            <option value="andi">Andi</option>
            <option value="budi">Budi</option>
            <option value="sari">Sari</option>
        </select>
        <button class="btn-generate" onclick="ask()">Generate</button>
    </div>

    <div id="loading" class="loading">
        <div class="pulse"></div><div class="pulse"></div><div class="pulse"></div>
        <p style="color: var(--text-p); font-size: 14px; margin-top: 15px;">Scanning Knowledge Base...</p>
    </div>

    <div id="result" class="result-container">
        <div class="answer-box">
            <div id="typewriter" class="typewriter"></div>
            
            <div id="insight-container" class="insight-box" style="display:none;">
                <h4>AI Insight</h4>
                <p id="insight-text"></p>
            </div>

            <div class="sources-area">
                <div style="font-size: 12px; color: var(--text-p); margin-bottom: 10px; font-weight: 600;">SOURCES:</div>
                <div id="sources"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const API = "http://127.0.0.1:8000";

    function typeEffect(element, text, speed = 15) {
        let i = 0;
        element.innerHTML = "";
        const timer = setInterval(() => {
            if (i < text.length) {
                element.innerHTML += text.charAt(i);
                i++;
            } else {
                clearInterval(timer);
            }
        }, speed);
    }

    async function ask() {
        const q = document.getElementById("question").value;
        const user = document.getElementById("user").value;
        if (!q) return;

        document.getElementById("loading").style.display = "block";
        document.getElementById("result").style.display = "none";

        try {
            const res = await fetch(`${API}/answer?q=${encodeURIComponent(q)}&username=${user}`);
            const data = await res.json();

            document.getElementById("loading").style.display = "none";
            document.getElementById("result").style.display = "block";

            // Typewriter untuk Answer
            const answerEl = document.getElementById("typewriter");
            typeEffect(answerEl, data.answer);

            // Insight Logic
            if(data.answer.length > 50) {
                document.getElementById("insight-container").style.display = "block";
                document.getElementById("insight-text").innerText = "Berdasarkan konteks dokumen, poin ini sangat krusial untuk implementasi Knowledge Management di divisi Anda.";
            }

            // Sources
            const srcDiv = document.getElementById("sources");
            srcDiv.innerHTML = data.sources.map(s => `<div class="source-tag">📂 ${s}</div>`).join('');

        } catch (e) {
            alert("Koneksi ke API gagal!");
            document.getElementById("loading").style.display = "none";
        }
    }

    document.getElementById("question").addEventListener("keypress", (e) => {
        if (e.key === "Enter") ask();
    });
</script>

</body>
</html>
